<!DOCTYPE html>
<html>
<head>
<title>Explore the World</title>

<style>
body{
font-family: Arial;
background-image: url('back.png');
background-size: cover;
background-position: center;
background-repeat: no-repeat;
background-attachment: fixed;
text-align:center;
}

/* Top Bar */
.top-bar{
display:flex;
justify-content:space-between;
padding:10px 30px;
font-size:18px;
font-weight:bold;
}

.top-bar span{
cursor:pointer;
color:#2E8B57;
background:white;
padding:8px 15px;
border-radius:20px;
box-shadow:0 2px 6px rgba(0,0,0,0.2);
transition:0.3s;
}

.top-bar span:hover{
background:#2E8B57;
color:white;
}

h1{
color:#2E8B57;
}

.category-btn{
padding:10px 20px;
margin:10px;
border:none;
border-radius:20px;
background:#2E8B57;
color:white;
cursor:pointer;
}

.category-btn:hover{
background:#1F6B45;
}

.places{
display:flex;
flex-wrap:wrap;
justify-content:center;
}

.card{
background:white;
padding:15px;
margin:10px;
width:200px;
border-radius:10px;
box-shadow:0 4px 8px rgba(0,0,0,0.2);
transition:0.3s;
cursor:pointer;
}

.card:hover{
transform: translateY(-10px) scale(1.05);
background:#2E8B57;
color:white;
box-shadow:0 8px 20px rgba(0,0,0,0.4);
}

.gallery{
display:flex;
flex-wrap:wrap;
justify-content:center;
margin-top:20px;
}

.img-box{
position:relative;
width:180px;
height:240px;
margin:10px;
border-radius:12px;
overflow:hidden;
cursor:pointer;
}

.img-box img{
width:100%;
height:100%;
object-fit:cover;
transition:0.4s;
}

.overlay{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
color:white;
display:flex;
justify-content:center;
align-items:center;
font-size:20px;
font-weight:bold;
opacity:0;
transition:0.4s;
}

.img-box:hover img{
transform:scale(1.1);
}

.img-box:hover .overlay{
opacity:1;
}
</style>

</head>

<body>

<!-- TOP BAR -->
<div class="top-bar">
<span onclick="goHome()">⬅ Back </span>
</div>

<h1>🌍 Explore the World</h1>

<button class="category-btn" onclick="filterPlaces('all')">All</button>
<button class="category-btn" onclick="filterPlaces('mountain')">🏔 Mountains</button>
<button class="category-btn" onclick="filterPlaces('beach')">🏝 Beaches</button>
<button class="category-btn" onclick="filterPlaces('temple')">🛕 Temples</button>

<div class="places">
<div class="card mountain" onclick="selectPlace('kedarnath')">Kedarnath</div>
<div class="card temple" onclick="selectPlace('tirumala')">Tirumala</div>
<div class="card temple" onclick="selectPlace('arunachalam')">Arunachalam</div>
<div class="card beach" onclick="selectPlace('phuket')">Phuket</div>
<div class="card mountain" onclick="selectPlace('spiti')">Spiti Valley</div>
<div class="card temple" onclick="selectPlace('varanasi')">Varanasi</div>
<div class="card mountain" onclick="selectPlace('ziro')">Ziro Valley</div>
<div class="card beach" onclick="selectPlace('dhanushkoti')">Dhanushkoti</div>
<div class="card mountain" onclick="selectPlace('ladakh')">Ladakh</div>
</div>

<h2>📸 Explore Beautiful Places</h2>

<div class="gallery">
<div class="img-box">
<img src="tirumala.png">
<div class="overlay">Tirumala</div>
</div>

<div class="img-box">
<img src="kedarnath.png">
<div class="overlay">Kedarnath</div>
</div>

<div class="img-box">
<img src="ladakh.png">
<div class="overlay">Ladakh</div>
</div>

<div class="img-box">
<img src="varanasi.png">
<div class="overlay">Varanasi</div>
</div>

<div class="img-box">
<img src="aizwal.png">
<div class="overlay">Aizawl</div>
</div>
</div>

<script>

function goHome(){
window.location.href = "index.html";
}

function goWishlist(){
window.location.href = "wishlist.html";
}

function filterPlaces(category){
let cards = document.querySelectorAll(".card");

cards.forEach(card => {
if(category === "all"){
card.style.display = "block";
}
else if(card.classList.contains(category)){
card.style.display = "block";
}
else{
card.style.display = "none";
}
});
}

function selectPlace(place){
localStorage.setItem("selectedPlace", place);

if(place === "kedarnath"){
window.location.href = "kedarnath.html";
}
else if(place === "tirumala"){
window.location.href = "tirumala.html";
}
else if(place === "phuket"){
window.location.href = "phuket.html";
}
else if(place === "spiti"){
window.location.href = "svalley.html";
}
else if(place === "varanasi"){
window.location.href = "varanasi.html";
}
else if(place === "dhanushkoti"){
window.location.href = "dhanushkoti.html";
}
else if(place === "ziro"){
window.location.href = "zvalley.html";
}
else if(place === "ladakh"){
window.location.href = "ladakh.html";
}
else if(place === "arunachalam"){
window.location.href = "arunachalam.html";
}
}

</script>

</body>
</html>
